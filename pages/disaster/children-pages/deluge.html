<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>deluge</title>
  <link rel="stylesheet" href="../../../styles/reset.css">
  <link rel="stylesheet" href="../../../styles/papers.css">
  <script defer src="../../../js/papers.js"></script>
  <style>
    body {
      width: 100%;
      background-image: url('../../../assets/imgs/background.webp');
      background-size: contain;
      background-position: center;
      background-attachment: fixed;
      padding: 10rem 8rem 10rem;
    }

    /* 卡片主题色 - 洪灾 */
    .title,
    .title-time {
      background-color: #1E4C79;
      border-color: #1E4C79;
    }

    .title-time p {
      background-color: #1E4C79;
      color: #f9eac9;
    }

    .detail,
    .talk,
    .display-imgs {
      border-color: #1E4C79;
    }

    .call p {
      -webkit-text-stroke-color: #1E4C79;
    }

    .call-dressing>div:nth-child(1) {
      border-top-color: #1E4C79;
    }

    .call-dressing>div:nth-child(2) {
      background-color: #1E4C79;
    }

    .people {
      background-color: #1E4C79;
    }
  </style>
</head>

<body>
  <!-- 返回 -->
  <div class="back-btn"><img src="../../../assets/imgs/coexistence/disater/back-btn.svg" alt=""></div>
  <div class="title-container" style="border-color: #1E4C79;">
    <div class="title title-full">
      <!-- 大标题 -->
      <div class="main">
        <!-- 1 -->
        <div class="title-item">
          <h5 class="h5-size">&nbsp;</h5>
          <h1 class="h1-size">12.</h1>
        </div>
        <!-- 2 -->
        <div class="title-item">
          <h5 class="h5-size">&nbsp;</h5>
          <h1 class="h1-size">12</h1>
        </div>
        <!-- 3 -->
        <div class="title-item">
          <h5 class="h5-size">HE</h5>
          <h1 class="h1-size">和</h1>
        </div>
        <!-- 4 -->
        <div class="title-item">
          <h5 class="h5-size">PING</h5>
          <h1 class="h1-size">平</h1>
        </div>
        <!-- 5 -->
        <div class="title-item">
          <h5 class="h5-size">ZHI</h5>
          <h1 class="h1-size">之</h1>
        </div>
        <!-- 6 -->
        <div class="title-item">
          <h5 class="h5-size">YE</h5>
          <h1 class="h1-size">夜</h1>
        </div>
      </div>
      <!-- 说明语段 -->
      <div class="title-description"><span>接力诵读</span><span>缅怀同胞</span><span>祈愿和平</span><span>守护和平</span></div>
    </div>
  </div>
  <!-- 号外 -->
  <div class="description">
    <!-- 号外 -->
    <span class="call">
      <p>共读!</p>
      <div class="call-dressing">
        <div></div>
        <div>GONGDU</div>
      </div>
    </span>
    <span class="detail detail-size" style="font-size: 2.4rem;">
      <p style="margin-top: 26px;">12月12日晚9点，中山门前烛光点点，伴着小提琴声，"12·12和平之夜"接力诵读活动开启。</p>
      <p>4位领读者在4个地标接力诵读，为逝者哀，为和平祈，用声音守护这座城。</p>
      <p>线上"和平之声 云上共读"与线下接力相呼应，传递铭记历史、珍爱和平的信念。</p>
    </span>
    <div></div>
    <div></div>
  </div>
  <!-- 展示图片 -->
  <div class="display-imgs"><img src="../../../assets/imgs/coexistence/disater/deluge/01.png" alt="01"
      style="width: 100%;"></div>
</body>

</html>
